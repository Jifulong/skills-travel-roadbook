<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>川西环线 · 路线与景点</title>
<style>
  :root{
    --bg:#0e1116; --panel:#161b22; --line:#242c37; --fg:#e6edf3; --dim:#8b949e;
    --accent:#f0883e;
    --d1:#f97316; --d2:#eab308; --d3:#22c55e; --d4:#06b6d4; --d5:#8b5cf6; --d6:#ec4899;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);
       font:14px/1.6 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
       display:flex;height:100vh;overflow:hidden}
  #side{width:400px;min-width:400px;border-right:1px solid var(--line);
        display:flex;flex-direction:column;background:var(--panel)}
  header{padding:16px 18px 12px;border-bottom:1px solid var(--line)}
  h1{margin:0 0 4px;font-size:17px;font-weight:600;letter-spacing:.02em}
  .sub{color:var(--dim);font-size:12px;font-variant-numeric:tabular-nums}
  #tabs{display:flex;gap:6px;padding:12px 18px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
  .tab{padding:5px 11px;border-radius:14px;border:1px solid var(--line);background:transparent;
       color:var(--dim);cursor:pointer;font-size:12px;font-weight:500;transition:.15s}
  .tab:hover{color:var(--fg);border-color:#3d4653}
  .tab.on{color:#0e1116;font-weight:700;border-color:transparent}
  #list{flex:1;overflow-y:auto;padding:14px 18px 40px}
  .dayhead{display:flex;align-items:baseline;gap:10px;margin:0 0 12px}
  .dayhead b{font-size:15px}
  .dayhead span{color:var(--dim);font-size:12px;font-variant-numeric:tabular-nums}
  .spot{display:flex;gap:11px;padding:9px 0;border-bottom:1px solid #1d242e;cursor:pointer}
  .spot:hover{background:#1b222c}
  .spot:last-child{border-bottom:0}
  .idx{width:21px;height:21px;flex:0 0 21px;border-radius:50%;display:grid;place-items:center;
       font-size:11px;font-weight:700;color:#0e1116;margin-top:3px}
  .meta{flex:1;min-width:0}
  .nm{font-weight:600;font-size:13.5px}
  .orig{color:var(--dim);font-size:11.5px;margin-top:1px}
  .thumb{width:64px;height:48px;flex:0 0 64px;border-radius:5px;object-fit:cover;
         background:#22282f;border:1px solid var(--line)}
  /* 段间里程/耗时 */
  .leg{display:flex;align-items:center;gap:7px;padding:3px 0 3px 32px;font-size:11.5px;
       color:#7d8899;font-variant-numeric:tabular-nums}
  .leg b{color:#a9b4c2;font-weight:600}
  .leg s{text-decoration:none;color:#5d6773}
  .warnleg b{color:#e8b563}
  /* 图片来源标记 */
  .src{position:absolute;right:2px;bottom:2px;font-size:9px;line-height:1;padding:1px 3px;
       border-radius:2px;background:rgba(0,0,0,.66);color:#e6edf3}
  .ph{position:relative;flex:0 0 auto}
  .xhslink{display:block;font-size:11.5px;color:#ff5b7f;text-decoration:none;margin-top:3px}
  .xhslink:hover{text-decoration:underline}
  /* 海拔 + 实况天气 */
  .wx{display:flex;align-items:center;gap:6px;margin-top:3px;font-size:11.5px;
      color:#8b98a8;font-variant-numeric:tabular-nums}
  .wx .alt{font-weight:600;color:#c3ccd8}
  .wx .alt.hi{color:#e8b563}          /* 4500m 以上标黄, 高反风险 */
  .wx .cold{color:#7fb6e8}            /* 最低温 ≤0 标蓝 */
  .wx .est{border-bottom:1px dashed #4a5563}   /* 历史同期估算, 与预报区分 */
  /* 详情面板里的 7 天预报 */
  .fc{width:100%;border-collapse:collapse;margin:8px 0 4px;font-size:11.5px;
      font-variant-numeric:tabular-nums}
  .fc th{text-align:left;font-weight:600;color:#8b949e;padding:2px 4px 5px 0;font-size:10.5px}
  .fc td{padding:3px 4px 3px 0;border-top:1px solid #232b36;color:#c3ccd8}
  .fc td.t{color:#8b98a8}
  .fc td.pop{color:#7fb6e8;text-align:right}
  .fc tr.on td{background:#1e2a38;color:#e6edf3;font-weight:600}
  /* 特色景观标签 */
  .tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
  .tag{font-size:10.5px;line-height:1;padding:3px 6px;border-radius:3px;
       border:1px solid #2f3947;color:#9fb0c4;background:#1a212b;cursor:help}
  .tag.n{border-color:#3c4a3a;color:#a8c79a;background:#1a231a}  /* 名称命中, 较可靠 */
  .nophoto{width:64px;height:48px;flex:0 0 64px;border-radius:5px;background:#1b2027;
           border:1px dashed #333c48;display:grid;place-items:center;color:#4d5765;font-size:10px}
  #warn{margin:0 18px 14px;padding:9px 11px;border-radius:6px;font-size:12px;
        background:#2a1f12;border:1px solid #5a3d1a;color:#e8b563}
  #warn b{display:block;margin-bottom:3px}
  #main{flex:1;position:relative;background:#0b0e12}
  #map{position:absolute;inset:0}
  #nokey{position:absolute;inset:0;display:none;flex-direction:column}
  #nokey.on{display:flex}
  #nokey .banner{padding:9px 14px;background:#1c2530;border-bottom:1px solid var(--line);
                 font-size:12px;color:var(--dim)}
  #nokey .banner code{color:var(--accent);background:#0e1116;padding:1px 5px;border-radius:3px}
  #svgwrap{flex:1;position:relative}
  /* 必须限定 #svg —— 全局 svg 选择器会命中高德内部的 SVG 覆盖物图层, 把折线挤出可视区 */
  #svg{position:absolute;inset:0;width:100%;height:100%}
  .mk{cursor:pointer}
  .mklab{font-size:10px;fill:#c9d4e0;paint-order:stroke;stroke:#0b0e12;stroke-width:3px}
  /* 面板本身不滚, 只让内容区滚 —— 这样关闭按钮不会跟着滑走。
     不设高度上限时, 3 张大图就能撑到 1300px, 视口外的部分完全够不着。 */
  #detail{position:absolute;right:14px;top:14px;width:290px;background:rgba(22,27,34,.97);
          border:1px solid var(--line);border-radius:9px;padding:13px;display:none;
          max-height:calc(100vh - 28px);flex-direction:column;
          backdrop-filter:blur(8px);box-shadow:0 8px 28px rgba(0,0,0,.5)}
  #detail.on{display:flex}
  #dbody{overflow-y:auto;overscroll-behavior:contain;padding-right:4px;margin-right:-4px}
  #dbody::-webkit-scrollbar{width:7px}
  #dbody::-webkit-scrollbar-thumb{background:#3a4453;border-radius:4px}
  #detail h3{margin:0 0 3px;font-size:14.5px}
  #detail .addr{color:var(--dim);font-size:11.5px;margin-bottom:9px}
  #detail img{width:100%;border-radius:5px;margin-bottom:6px;display:block}
  #detail .x{position:absolute;right:9px;top:8px;cursor:pointer;color:var(--dim);
             font-size:17px;line-height:1}
  #detail .x:hover{color:var(--fg)}
</style>
</head>
<body>
<div id="side">
  <header>
    <h1>川西大环线 · 6 天</h1>
    <div class="sub" id="stat">载入中…</div>
  </header>
  <div id="tabs"></div>
  <div id="warn" style="display:none"></div>
  <div id="list"></div>
</div>
<div id="main">
  <div id="map"></div>
  <div id="nokey">
    <div class="banner">
      未配置高德 JS API key，当前为<b>无底图示意模式</b>（折线与点位真实坐标）。
      填入 key 后自动切换真实地图：<code>?jskey=你的key</code>
    </div>
    <div id="svgwrap"><svg id="svg"></svg></div>
  </div>
  <div id="detail"><span class="x" onclick="closeDetail()">×</span><div id="dbody"></div></div>
</div>

<script>
/* ===================== 高德配置 =====================
 * 按访问域名自动选一套, 所以本地和线上可以用同一份文件, 部署时什么都不用改。
 *
 * 线上 key 建议在高德控制台配「域名白名单」(填你自己的域名)。
 * 配了白名单后 localhost 就会报 INVALID_USER_DOMAIN, 所以本地单独用一个 key ——
 * 要么申请第二个不配白名单的 key, 要么临时用 ?jskey=xxx 覆盖。
 */
const IS_LOCAL = ['localhost', '127.0.0.1', '::1', ''].includes(location.hostname);

const AMAP_LOCAL = {
  key: 'PUT_YOUR_AMAP_JS_KEY_HERE',
  securityCode: 'PUT_YOUR_AMAP_SECURITY_CODE_HERE',   // 本地明文即可
  serviceHost: '',
};
const AMAP_PROD = {
  key: 'PUT_YOUR_AMAP_JS_KEY_HERE',            // ← 换成配了白名单的那个 key
  securityCode: '',                                    // 线上不放明文密钥
  serviceHost: ''  /* 例: 'https://your.domain/_AMapService' */,  // 由 nginx 注入 jscode
};
const AMAP = IS_LOCAL ? AMAP_LOCAL : AMAP_PROD;
/* =================================================== */

const COLORS = ['#f97316','#eab308','#22c55e','#06b6d4','#8b5cf6','#ec4899'];
const JSKEY = new URLSearchParams(location.search).get('jskey') || AMAP.key;
let DATA = null, cur = 0, map = null, overlays = [], DATE_OF = [];

fetch('data.json').then(r => r.json()).then(d => { DATA = d; init(); })
  .catch(e => document.getElementById('stat').textContent = '加载 data.json 失败：' + e.message);

function init(){
  DATE_OF = DATA.days.map(d => d.date || '');
  const nSpot = DATA.days.reduce((a, d) => a + d.spots.length, 0);
  const nPhoto = DATA.days.reduce((a, d) => a + d.spots.filter(s => s.photos.length).length, 0);
  document.getElementById('stat').textContent =
    `全程 ${DATA.total_km} km · ${nSpot} 个点位 · ${nPhoto} 个有实景图`;

  document.getElementById('tabs').innerHTML = DATA.days.map((d, i) =>
    `<button class="tab" data-i="${i}">D${d.day}</button>`).join('');
  document.querySelectorAll('.tab').forEach(b =>
    b.onclick = () => select(+b.dataset.i));

  if (DATA.warnings && DATA.warnings.length){
    const w = document.getElementById('warn');
    w.style.display = 'block';
    w.innerHTML = `<b>⚠ ${DATA.warnings.length} 条待核对</b>` +
      DATA.warnings.map(x => `· ${esc(x)}`).join('<br>');
  }

  if (JSKEY) loadAMap(); else document.getElementById('nokey').classList.add('on');
  const wantDay = +(new URLSearchParams(location.search).get('day') || 0);
  const at = DATA.days.findIndex(d => d.day === wantDay);
  select(at >= 0 ? at : 0);
}

function esc(s){ return String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
const hm = m => `${Math.floor(m / 60)}h${String(m % 60).padStart(2, '0')}m`;

/* 海拔 + 天气一行。
 * 有出发日期时优先显示"当日预报"; 超出 16 天预报窗口的日子退回"历史同期"。
 * 海拔 ≥4500m 标黄(高反), 最低温 ≤0 标蓝。 */
function wxLine(s){
  const w = s.wx;
  if (!w) return '';
  const alt = `<span class="alt${w.elevation >= 4500 ? ' hi' : ''}">${w.elevation}m</span>`;
  const wd = s.wx_day;
  const c = s.clim;
  let body;
  if (wd) {
    body = `<span title="该日预报">${esc(wd.desc)} `
      + `<span class="${wd.tmin <= 0 ? 'cold' : ''}">${Math.round(wd.tmin)}~${Math.round(wd.tmax)}°C</span>`
      + (wd.pop != null ? ` 降水${wd.pop}%` : '') + `</span>`;
  } else if (c) {
    body = `<span class="est" title="超出预报窗口，用近 ${c.years.length} 年同期均值">`
      + `同期 <span class="${c.tmin <= 0 ? 'cold' : ''}">${c.tmin}~${c.tmax}°C</span>`
      + (c.rain_days_pct != null ? ` 雨天${c.rain_days_pct}%` : '') + `</span>`;
  } else {
    const d0 = (w.daily && w.daily[0]) || null;
    body = d0 ? `<span>今 ${Math.round(d0.tmin)}~${Math.round(d0.tmax)}°C</span>` : '';
  }
  return `<div class="wx">${alt}${body}</div>`;
}

/* 详情面板里的多日预报表 */
function forecast(w, onDate){
  if (!w || !w.daily || !w.daily.length) return '';
  const rows = w.daily.map(d => {
    const hit = onDate && d.date === onDate;
    const md = d.date.slice(5).replace('-', '/');
    return `<tr${hit ? ' class="on"' : ''}><td class="t">${md}${hit ? ' ←' : ''}</td><td>${esc(d.desc)}</td>
      <td class="${d.tmin <= 0 ? 'cold' : ''}">${Math.round(d.tmin)}~${Math.round(d.tmax)}°C</td>
      <td class="pop">${d.pop != null ? d.pop + '%' : ''}</td></tr>`;
  }).join('');
  return `<table class="fc"><tr><th>日期</th><th>天气</th><th>气温</th><th>降水</th></tr>${rows}</table>`;
}

function select(i){
  cur = i;
  const d = DATA.days[i], c = COLORS[i % 6];
  document.querySelectorAll('.tab').forEach((b, j) => {
    b.classList.toggle('on', j === i);
    b.style.background = j === i ? COLORS[j % 6] : 'transparent';
  });
  const r = d.route;
  const dur = r ? `${Math.floor(r.duration_min/60)}h${String(r.duration_min%60).padStart(2,'0')}m` : '—';
  document.getElementById('list').innerHTML =
    `<div class="dayhead"><b>第 ${d.day} 天</b>
       <span>${d.date ? esc(d.date.slice(5).replace('-', '/')) + ' · ' : ''}${r ? r.distance_km + ' km · ' + dur : '未计算路线'}${d.stay ? ' · 宿 ' + esc(d.stay) : ''}</span></div>` +
    d.spots.map((s, k) => {
      const first = s.photos[0];
      const nx = s.photos.filter(p => p.src === 'xhs').length;
      const leg = s.leg_to_next;
      const legRow = leg ? `
        <div class="leg${leg.ratio && leg.ratio > 2.5 ? ' warnleg' : ''}">
          <s>↓</s><b>${leg.km} km</b><span>·</span><b>${hm(leg.min)}</b>
          ${leg.ratio && leg.ratio > 2.5 ? `<span>⚠ 绕行 ${leg.ratio}x，高德无此路段路网</span>` : ''}
        </div>` : '';
      return `
      <div class="spot" onclick="showSpot(${i},${k})">
        <div class="idx" style="background:${c}">${k + 1}</div>
        <div class="meta">
          <div class="nm">${esc(s.matched)}</div>
          <div class="orig">${s.input !== s.matched ? '原文「' + esc(s.input) + '」· ' : ''}${esc(s.adname)}${s.type ? ' · ' + esc(s.type) : ''}</div>
          ${wxLine(s)}
          ${(s.scenery && s.scenery.length) ? `<div class="tags">${s.scenery.map(t =>
            `<span class="tag${t.from === '名称' ? ' n' : ''}" title="依据：${esc(t.from)}">${esc(t.tag)}</span>`
          ).join('')}</div>` : ''}
        </div>
        ${first
          ? `<div class="ph"><img class="thumb" src="${first.url}" loading="lazy" referrerpolicy="no-referrer" alt="">
               <span class="src">${first.src === 'xhs' ? '书' : '德'}${nx ? '+' + nx : ''}</span></div>`
          : `<div class="nophoto">无图</div>`}
      </div>${legRow}`;
    }).join('');
  closeDetail();
  draw();
}

function showSpot(di, si){
  const s = DATA.days[di].spots[si];
  const leg = s.leg_to_next;
  document.getElementById('dbody').innerHTML =
    `<h3>${esc(s.matched)}</h3>
     <div class="addr">${esc(s.address || s.adname)}<br>${s.lon.toFixed(5)}, ${s.lat.toFixed(5)}
       ${s.wx ? ` · 海拔 ${s.wx.elevation}m` : ''}
       ${leg ? `<br>到下一点 ${leg.km} km · ${hm(leg.min)}` : ''}</div>` +
    forecast(s.wx, DATE_OF[di]) +
    (s.photos.length
      ? s.photos.map(p => `
          <img src="${p.url}" loading="lazy" referrerpolicy="no-referrer" alt="">
          ${p.src === 'xhs'
            ? `<a class="xhslink" href="${p.link || '#'}" target="_blank" rel="noreferrer">
                 小红书「${esc(p.title || '原帖')}」${p.author ? ' · @' + esc(p.author) : ''} ↗</a>`
            : ''}`).join('')
      : '<div class="addr">暂无实景图</div>');
  document.getElementById('detail').classList.add('on');
  if (map) map.setZoomAndCenter(12, [s.lon, s.lat]);
}
function closeDetail(){ document.getElementById('detail').classList.remove('on'); }

/* ---------- 高德 JS API 2.0 ---------- */
function loadAMap(){
  // serviceHost 优先: 走 nginx 代理时前端不出现密钥
  window._AMapSecurityConfig = AMAP.serviceHost
    ? { serviceHost: AMAP.serviceHost }
    : { securityJsCode: AMAP.securityCode };
  console.log(`[map] ${IS_LOCAL ? '本地' : '线上'}配置 · ` +
              (AMAP.serviceHost ? '代理 ' + AMAP.serviceHost : '明文密钥'));
  const s = document.createElement('script');
  s.src = `https://webapi.amap.com/maps?v=2.0&key=${encodeURIComponent(JSKEY)}`;
  s.onload = () => {
    map = new AMap.Map('map', { mapStyle:'amap://styles/dark', zoom:7, center:[101.5,30.1], viewMode:'2D' });
    draw();
  };
  s.onerror = () => document.getElementById('nokey').classList.add('on');
  document.head.appendChild(s);
}

function draw(){ map ? drawAMap() : drawSVG(); }

function drawAMap(){
  overlays.forEach(o => map.remove(o));
  overlays = [];
  const d = DATA.days[cur], c = COLORS[cur % 6];
  if (d.route){
    const pl = new AMap.Polyline({ path:d.route.polyline, strokeColor:c, strokeWeight:5, strokeOpacity:.9 });
    overlays.push(pl); map.add(pl);
  }
  d.spots.forEach((s, k) => {
    const m = new AMap.Marker({
      position:[s.lon, s.lat],
      content:`<div style="width:22px;height:22px;border-radius:50%;background:${c};color:#0e1116;
               font:700 11px/22px sans-serif;text-align:center;border:2px solid #0e1116;
               box-shadow:0 1px 4px rgba(0,0,0,.6)">${k+1}</div>`,
      offset:new AMap.Pixel(-11,-11), title:s.matched
    });
    m.on('click', () => showSpot(cur, k));
    overlays.push(m); map.add(m);
  });
  map.setFitView(overlays, false, [60,60,60,60]);
}

/* ---------- 无 key 时的示意折线 ---------- */
function drawSVG(){
  const d = DATA.days[cur], c = COLORS[cur % 6];
  const wrap = document.getElementById('svgwrap');
  const W = wrap.clientWidth || 800, H = wrap.clientHeight || 600, PAD = 56;
  const pts = d.route ? d.route.polyline : d.spots.map(s => [s.lon, s.lat]);
  const lons = pts.map(p => p[0]), lats = pts.map(p => p[1]);
  const x0 = Math.min(...lons), x1 = Math.max(...lons);
  const y0 = Math.min(...lats), y1 = Math.max(...lats);
  // 按纬度做 cos 修正，避免东西向被拉伸
  const kx = Math.cos((y0 + y1) / 2 * Math.PI / 180);
  const sc = Math.min((W - 2*PAD) / Math.max((x1-x0)*kx, 1e-6), (H - 2*PAD) / Math.max(y1-y0, 1e-6));
  const cxOff = (W - (x1-x0)*kx*sc)/2, cyOff = (H - (y1-y0)*sc)/2;
  const X = lon => cxOff + (lon - x0)*kx*sc;
  const Y = lat => H - cyOff - (lat - y0)*sc;

  const path = pts.map((p,i) => (i ? 'L' : 'M') + X(p[0]).toFixed(1) + ',' + Y(p[1]).toFixed(1)).join(' ');
  const marks = d.spots.map((s,k) => `
    <g class="mk" onclick="showSpot(${cur},${k})">
      <circle cx="${X(s.lon).toFixed(1)}" cy="${Y(s.lat).toFixed(1)}" r="9"
              fill="${c}" stroke="#0b0e12" stroke-width="2"/>
      <text x="${X(s.lon).toFixed(1)}" y="${(Y(s.lat)+3.5).toFixed(1)}" text-anchor="middle"
            font-size="10" font-weight="700" fill="#0b0e12">${k+1}</text>
      <text class="mklab" x="${X(s.lon).toFixed(1)}" y="${(Y(s.lat)-14).toFixed(1)}"
            text-anchor="middle">${esc(s.matched)}</text>
    </g>`).join('');
  document.getElementById('svg').innerHTML =
    `<path d="${path}" fill="none" stroke="${c}" stroke-width="2.5" stroke-opacity=".85"/>${marks}`;
}
window.addEventListener('resize', () => { if (!map) drawSVG(); });
</script>
</body>
</html>
